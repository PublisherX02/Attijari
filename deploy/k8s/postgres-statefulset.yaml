apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: attijari
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: attijari
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          # Matches the pgaudit WORM-logging flags already configured in
          # the repo's existing docker-compose.yml.
          args:
            - "-c"
            - "shared_preload_libraries=pgaudit"
            - "-c"
            - "pgaudit.log=write, ddl"
            - "-c"
            - "pgaudit.log_relation=on"
          env:
            - name: POSTGRES_USER
              value: "attijari_user"
            - name: POSTGRES_DB
              value: "attijari_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attijari-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
