apiVersion: v1
kind: ServiceAccount
metadata:
  name: attijari-sandbox-runner
  namespace: attijari
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: attijari-sandbox-runner
  namespace: attijari
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: attijari-sandbox-runner
  namespace: attijari
subjects:
  - kind: ServiceAccount
    name: attijari-sandbox-runner
    namespace: attijari
roleRef:
  kind: Role
  name: attijari-sandbox-runner
  apiGroup: rbac.authorization.k8s.io
