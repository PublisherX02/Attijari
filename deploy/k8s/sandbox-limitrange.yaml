# Kubernetes has no per-container pids-limit API field (unlike Docker's
# --pids-limit). A namespace-level LimitRange is the closest equivalent
# control available without cluster-wide kubelet config changes.
apiVersion: v1
kind: LimitRange
metadata:
  name: attijari-sandbox-limits
  namespace: attijari
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "500m"
        memory: "256Mi"
