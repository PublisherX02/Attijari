# On-prem — no cloud LoadBalancer assumed. This Ingress requires an
# ingress controller already running on the target cluster (e.g. ingress-
# nginx, commonly pre-installed on-prem) and a TLS Secret named
# attijari-tls (created on the bank VM the same way as attijari-secrets —
# never committed). Plain HTTP is never served externally, matching the
# project's existing "never expose 0.0.0.0 plain-HTTP" rule.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attijari-app
  namespace: attijari
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - secretName: attijari-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: attijari-app
                port:
                  number: 80
