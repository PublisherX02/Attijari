# RQ worker pods — process pipeline jobs enqueued by the app pods
# (src/smtp_receiver.py) and the safety-net sweep. Same image, ServiceAccount
# (workers call sandbox.run_tool() -> the K8s-Jobs sandbox backend, needing
# the same RBAC as the app pods), and config/secrets as attijari-app —
# only the container command differs.
#
# replicas is pinned to 1 deliberately: this POC targets a single,
# memory-constrained VM (see the detonation-window and
# _ollama_reachable() memory-guard rationale used elsewhere in this
# codebase). Two or more worker replicas could each pick up a pipeline job
# concurrently and run full LLM/extraction work in parallel, reintroducing
# via worker parallelism exactly the memory-overlap risk the detonation
# guard exists to prevent. Safely raising this requires first extending
# that memory-guard coordination to cover multiple worker processes —
# out of scope for this plan.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attijari-worker
  namespace: attijari
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attijari-worker
  template:
    metadata:
      labels:
        app: attijari-worker
    spec:
      serviceAccountName: attijari-sandbox-runner
      containers:
        - name: worker
          image: attijari-app:latest  # same image as attijari-app; built on the bank VM
          command: ["rq"]
          args: ["worker", "attijari-pipeline", "--url", "$(REDIS_URL)", "--with-scheduler"]
          envFrom:
            - configMapRef:
                name: attijari-config
            - secretRef:
                name: attijari-secrets
          volumeMounts:
            - name: sandbox-workdir
              mountPath: /sandbox-workdir
            - name: smtp-pending-data
              mountPath: /app/data/smtp_pending
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: sandbox-workdir
          persistentVolumeClaim:
            claimName: sandbox-workdir
        - name: smtp-pending-data
          persistentVolumeClaim:
            claimName: smtp-pending-data
