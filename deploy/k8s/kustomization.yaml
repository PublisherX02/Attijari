apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: attijari
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-statefulset.yaml
  - redis-statefulset.yaml
  - ollama-deployment.yaml
  - sandbox-rbac.yaml
  - sandbox-networkpolicy.yaml
  - sandbox-limitrange.yaml
  - sandbox-workdir-pvc.yaml
  - app-deployment.yaml
  - worker-deployment.yaml
  - app-service.yaml
  - app-ingress.yaml
# secret.yaml is intentionally NOT listed here — it's created directly on
# the bank VM (see secret.yaml.example) and applied separately:
#   kubectl apply -f deploy/k8s/secret.yaml
#   kubectl apply -k deploy/k8s/
