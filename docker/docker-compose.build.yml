# Build-only compose file — builds all extraction container images
# Usage: docker compose -f docker/docker-compose.build.yml build
#
# These containers are NOT long-running services. They are invoked
# per-attachment by sandbox.py with strict security constraints.

services:
  magic:
    build:
      context: .
      dockerfile: magic.Dockerfile
    image: imania-extract-magic

  oletools:
    build:
      context: .
      dockerfile: oletools.Dockerfile
    image: imania-extract-oletools

  pdfid:
    build:
      context: .
      dockerfile: pdfid.Dockerfile
    image: imania-extract-pdfid

  pymupdf:
    build:
      context: .
      dockerfile: pymupdf.Dockerfile
    image: imania-extract-pymupdf

  tesseract:
    build:
      context: .
      dockerfile: tesseract.Dockerfile
    image: imania-extract-tesseract

  yara:
    build:
      context: .
      dockerfile: yara.Dockerfile
    image: imania-extract-yara

  ioc-finder:
    build:
      context: .
      dockerfile: ioc_finder.Dockerfile
    image: imania-extract-ioc-finder

  markitdown:
    build:
      context: .
      dockerfile: markitdown.Dockerfile
    image: imania-extract-markitdown
