{% extends "base.html" %}
{% block title %}System Health — Attijari{% endblock %}

{% block content %}
<div class="page-header">
    <h2>System Health</h2>
    <p class="page-subtitle">Live status of all system components</p>
</div>

<div style="margin-bottom: 24px;">
    <button class="btn btn-outline" data-action="load-health">🔄 Refresh</button>
</div>

<div class="health-grid" id="health-grid">
    <div class="loading-overlay"><div class="spinner"></div> Checking…</div>
</div>

<div class="page-header" style="margin-top:32px">
    <h2>Sandbox VM</h2>
    <p class="page-subtitle">CAPE machines, the sandbox VM, and recent detonation tasks</p>
</div>
<div id="vm-bubble-row"></div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">document.addEventListener('DOMContentLoaded', () => { loadHealth(); renderVmBubble(); });</script>
{% endblock %}
