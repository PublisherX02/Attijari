version: '3.8'

services:
  imania-dashboard:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    # For a real deployment, you'd use a more complete Dockerfile for the app.
    # We mount the source code and run uvicorn locally.
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-imania_user}:${POSTGRES_PASSWORD:-imania_pass}@postgres:5432/${POSTGRES_DB:-imania_db}
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:?Set VAULT_ENCRYPTION_KEY in .env}
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - imania-dashboard

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-imania_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-imania_db}
    # Enable pgaudit for WORM logging
    command: >
      postgres
      -c shared_preload_libraries=pgaudit
      -c pgaudit.log='write, ddl'
      -c pgaudit.log_relation=on
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
