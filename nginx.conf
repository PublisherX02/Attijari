worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Define the rate limit zone (10MB memory, 60 requests per minute)
    limit_req_zone $binary_remote_addr zone=soc_limit:10m rate=60r/m;

    server {
        listen 80;
        server_name localhost soc.imania.local;

        # Drop slow connections immediately (Slow-loris protection)
        client_body_timeout 10s;
        client_header_timeout 10s;

        location / {
            # Enforce rate limit, queue up to 10 requests, drop the rest
            limit_req zone=soc_limit burst=10 nodelay;
            
            proxy_pass http://soc-dashboard:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
