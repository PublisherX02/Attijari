name: CI Pipeline

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  code-health:
    name: Code Health & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Linting Tools
        run: pip install black isort flake8
      - name: Check Formatting (Black)
        run: black --check . || echo "Black formatting issues found"
      - name: Check Imports (isort)
        run: isort --check-only . || echo "isort issues found"
      - name: Lint (flake8)
        run: flake8 . --exit-zero --max-line-length=88

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  dependency-scan:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install pip-audit & safety
        run: pip install pip-audit safety
      - name: Run pip-audit
        run: pip-audit || echo "Vulnerabilities found by pip-audit"
      - name: Run safety check
        run: safety check || echo "Vulnerabilities found by safety"

  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit & Semgrep
        run: pip install bandit semgrep
      - name: Run Bandit
        run: bandit -r src -ll -ii -f screen || echo "Bandit issues found"
      - name: Run Semgrep
        run: semgrep ci --config=p/ci || echo "Semgrep issues found"

  test:
    name: Pytest & Coverage
    runs-on: ubuntu-latest
    needs: [code-health, secret-scan] # Wait for basic checks to pass
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run Pytest
        run: pytest tests/ --cov=src --cov-report=xml -v
        env:
          # Required for some tests as seen in previous ci.yml
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
