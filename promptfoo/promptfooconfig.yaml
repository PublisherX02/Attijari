    vars:
      sender: "Youssef Bensalem via LinkedIn <invitations@linkedin.com>"
      subject: "Youssef accepted your invitation, explore their network"
      auth_status: "AUTH-PASS: all_pass\nSPF=pass DKIM=pass DMARC=pass"
      enrichment_signals: ""
      body: |
        Youssef Bensalem accepted your invitation.
        See their connections, experience, and more.
        View profile: https://www.linkedin.com/comm/in/youssef-bensalem
        You're receiving this email because you sent an invitation to connect.
    assert:
      - type: javascript
        value: |
          const j = JSON.parse(output);
          return j.verdict === "accepted";
        metric: verdict_accuracy
      - type: javascript
        value: |
          const j = JSON.parse(output);
          return j.risk_score <= 30;
        metric: risk_calibration

