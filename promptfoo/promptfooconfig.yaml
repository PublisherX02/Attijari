# Promptfoo configuration for ImaniIA email triage LLM
# Tests gemma3:4b verdict accuracy against known-good/known-bad emails
#
# Run:  cd promptfoo && npx promptfoo@latest eval --no-cache
# View: npx promptfoo@latest view

description: "ImaniIA - Email Verdict Accuracy"

prompts:
  - file://prompt_template.txt

providers:
  - id: ollama:gemma3:4b
    config:
      temperature: 0
      max_tokens: 1024

defaultTest:
  options:
    timeout: 180000
    transformVars: "vars"
    transform: |
      // Extract JSON from model output (handles markdown blocks, prose, etc.)
      const raw = output || '';
      // Try to find JSON block
      let jsonStr = raw;
      const codeBlock = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (codeBlock) jsonStr = codeBlock[1];
      // Find the JSON object containing "verdict"
      const idx = jsonStr.indexOf('"verdict"');
      if (idx !== -1) {
        let start = jsonStr.lastIndexOf('{', idx);
        if (start !== -1) {
          let depth = 0;
          for (let j = start; j < jsonStr.length; j++) {
            if (jsonStr[j] === '{') depth++;
            if (jsonStr[j] === '}') { depth--; if (depth === 0) { jsonStr = jsonStr.slice(start, j+1); break; } }
          }
        }
      }
      try { return JSON.stringify(JSON.parse(jsonStr)); } catch(e) { return raw; }

